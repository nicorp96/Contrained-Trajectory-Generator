# E8: the image model with the E7b pipeline. E7b (U-Net, no normalization, DDPM
# 100 steps, no classifier-free guidance, loss on padded steps, actions only,
# 16/8 plans, 2 history steps, ~1e8 samples) with the Fix 4 cameras (base, hand,
# top at 256x256, trainable ResNet18 + spatial softmax) instead of the object
# state: the policy sees joint positions/velocities and images, never the peg pose.
name: "diffusion_trj_pad_dp_cam_unet"
target: trainer.trainer_diffusion_traj.DiffusionTrajectoryPadHistTrainer
inpainting: False
start_indices: [0, 1, 2, 3, 4, 5 ,6 ,7, 8]

model:
  target: models.diffusion_unet1d.UNetTrjCC
  input_dim: 8         # actions only
  cond_dim: 7          # goal: box hole pose
  history: True
  history_shape: 210   # qpos 9 + qvel 9 + 3 cameras * 64 (spatial softmax, 32 keypoints)
  history_len: 2       # = dataset.sequence_hist; the U-Net sees the flattened history
  unet_dims: [64, 128, 256]   # ManiSkill Diffusion Policy defaults
  diffusion_step_embed_dim: 64
  kernel_size: 5
  n_groups: 8
  image_encoders:
    base_camera:
      type: "resnet18"
      pretrained: True
      trainable: True          # whole network
      norm: "group"            # BatchNorm -> GroupNorm
      pool: "spatial_softmax"
      num_keypoints: 32
      center_crop: False       # keep the full image
    hand_camera:
      type: "resnet18"
      pretrained: True
      trainable: True
      norm: "group"
      pool: "spatial_softmax"
      num_keypoints: 32
      center_crop: False
    top_camera:
      type: "resnet18"
      pretrained: True
      trainable: True
      norm: "group"
      pool: "spatial_softmax"
      num_keypoints: 32
      center_crop: False
  num_inference_steps: 100
  guidance_scale: 1.0
  cfg_drop_prob: 0.0
  noise_scheduler:
    target: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 100
    sampler: ddpm
    beta_start: 0.00001 #0.00001
    beta_end: 0.0085 # 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: False
    set_alpha_to_one: True
    steps_offset: 0
    prediction_type: epsilon # or sample or v_prediction
  guidance:
    target: models.utils.guidance_robot.CFGGuidance
    guidance_scale: 1.0
    constraint_eta: 0.0          # constraint guidance step (0 = off)
    constraint_grad_clip: 1.0
    constraint_start: 1.0        # fraction of the diffusion chain with guidance
    project_final: false

training:
  batch_size: 64           # x 16 accumulation = 1024; leaves GPU memory for other jobs on the machine
  learning_rate: 0.0001
  image_encoder_lr: 0.0001
  num_epochs: 501          # ~5e7 samples (102k per epoch): ~39 h with 3 cameras at 256x256
  use_ema: True
  optimizer: "adamw"
  log_dir: "runs/training"
  log_eval_dir: "runs/inference"
  output_dir: "logs"
  val_every: 50           # ~5000 iterations, as the reference's eval_freq
  save_every: 50
  mixed_precision: "bf16"  # | "fp16" | "bf16"
  gradient_accumulation_steps: 16  # equivalent: GroupNorm, LR/EMA step per optimizer step
  seed: 0
  num_workers: 16
  mask_padding: false     # padded steps (robot at rest) are part of the loss
  checkpoint_path: "logs"
  device: "cuda:0"
  plotting: true
  tqdm_interval_sec: 1.0
  from_ckp: false
  ckpt_name: "20251118-175851/logs/checkpoint_395.pth"
  scheduler:
    name: cosine              # Options: linear, cosine, step, constant, etc.
    num_warmup_steps: 5000     # Optional, required for warmup-based schedulers

evaluation:
  action_horizon: 8        # actions executed per plan before replanning

ema:
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataset:
  target: dataset.dataset_maniskill.TrajectoryPadDatasetHDF5
  path: "mani_skill_data/demos/PegInsertionSide-v1/motionplanning_top256/trajectory.state_dict+rgb.pd_joint_delta_pos.physx_cpu.h5"
  val: true
  split: true
  path_stats: "mani_skill_data/demos/PegInsertionSide-v1/motionplanning_top256/stats.json"
  val_ratio: 0.2
  samples_per_episode: 128  # 797 episodes x 128 = 102k samples per epoch
  split_seed: 0           # fixed episode-level train/val split
  expand_goal: 0
  sequence_len: 16        # plan horizon: 0.8 s at 20 Hz (reference: pred_horizon 16)
  sequence_hist: 2        # history t-1, t0 (reference: obs_horizon 2)
  state_shapes:
    actions:
      shape: 8
      method_norm: "none"

  goal_shapes:
    box_hole_pose:
      shape: 7
      method_norm: "none"
    # camera?

  obs_shapes:
    qpos:
      shape: 9
      method_norm: "none"
    qvel:
      shape: 9
      method_norm: "none"
    base_camera:
      shape: (3, 256, 256)
      type: "rgb"
      method_norm: "none"
    hand_camera:
      shape: (3, 256, 256)
      type: "rgb"
      method_norm: "none"
    top_camera:
      shape: (3, 256, 256)
      type: "rgb"
      method_norm: "none"
