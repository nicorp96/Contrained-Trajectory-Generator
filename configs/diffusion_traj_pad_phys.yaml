name: "diffusion_trj_phys"
target: trainer.trainer_diffusion_traj.DiffusionTrajectoryPhysTrainer
inpainting: False
start_indices: [0, 1, 2, 3, 4, 5 ,6 ,7, 8]

model:
  target: models.diffusion_transformer.DiTTrjCC # DiTTrjCrossAtt
  input_dim: 35        # qpos: 9 * 2, tcp pose: 7 *2
  cond_dim: 7         # TCP pose END
  diffusion_t_embed_dim: 256
  d_model: 256
  n_heads: 4
  n_blocks: 3
  dropout: 0.1
  history: True
  history_shape: 1059
  time_encoder: False
  time_t_embed_dim: 256
  num_inference_steps: 25
  guidance_scale: 1.5
  cfg_drop_prob: 0.1
  noise_scheduler:
    target: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 1000
    beta_start: 0.00001 #0.00001
    beta_end: 0.0085 # 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: False
    set_alpha_to_one: True
    steps_offset: 0
    prediction_type: epsilon # or sample or v_prediction
  guidance:
    target: models.utils.guidance_robot.CFGGuidance
    guidance_scale: 1.5
    constraint_eta: 0.1          # constraint guidance step (0 = off)
    constraint_grad_clip: 1.0
    constraint_start: 1.0        # fraction of the diffusion chain with guidance
    project_final: true
  image_encoders:
    base_camera:
      type: "resnet18"
      pretrained: True
      trainable: True
      train_last_n: 1
      #train_last_n: 2
      out_pool: "avg"
    hand_camera:
      type: "resnet18" #"dinov2"
      #name: "facebook/dinov2-base"
      pretrained: True
      trainable: True
      out_pool: "avg"
      train_last_n: 1
      #train_last_n: 2
      #pool: "cls"

training:
  batch_size: 64
  learning_rate: 0.0001
  image_encoder_lr: 0.00001
  num_epochs: 5501
  use_ema: True
  optimizer: "adamw"
  log_dir: "runs/training"
  log_eval_dir: "runs/inference"
  output_dir: "logs"
  val_every: 100
  save_every: 100
  mixed_precision: "bf16"  # | "fp16" | "bf16"
  gradient_accumulation_steps: 1
  seed: 0
  num_workers: 8
  mask_padding: true      # exclude padded steps from the loss
  checkpoint_path: "logs"
  device: "cuda:0"
  plotting: true
  tqdm_interval_sec: 1.0
  from_ckp: false
  ckpt_name: "20251118-175851/logs/checkpoint_395.pth"
  scheduler:
    name: cosine              # Options: linear, cosine, step, constant, etc.
    num_warmup_steps: 5000     # Optional, required for warmup-based schedulers

ema:
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataset:
  target: dataset.dataset_maniskill.TrajectoryPadDatasetHDF5
  path: "mani_skill_data/demos/PegInsertionSide-DJT/motionplanning/trajectory.h5"
  val: true
  split: true
  path_stats: "mani_skill_data/demos/PegInsertionSide-DJT/motionplanning/stats.json"
  val_ratio: 0.2
  split_seed: 0           # fixed episode-level train/val split
  expand_goal: 0
  sequence_len: 430
  sequence_hist: 8 # 8 History time steps t-7, t-6, t-5, t-4, t-3, t-2, t-1, t0
  state_shapes:
    qpos:
      shape: 9
      method_norm: "sincos"
    qvel:
      shape: 9
      method_norm: "standard"

    actions:
      shape: 8
      method_norm: "standard"

  goal_shapes:
    box_hole_pose:
      shape: 7
      method_norm: "minmax"
    # camera?

  obs_shapes:
    qpos:
      shape: 9
      method_norm: "sincos"
    qvel:
      shape: 9
      method_norm: "standard"
    actions:
      shape: 8
      method_norm: "standard"
    base_camera:
      shape: (3, 128, 128)
      type: "rgb"
      method_norm: "none"
    hand_camera:
      shape: (3, 128, 128)
      type: "rgb"
      method_norm: "none"

physics_loss:
  lambda: 0.1              # weight of the constraint energy on x0_hat (alpha_bar weighted)

# Physical constraints (models/utils/robot_constraints.py). Used for validation /
# rollout metrics always; for sampling only if model.guidance.constraint_eta > 0
# or project_final is true. Check val/constraints_gt/* after the first validation:
# the demonstrations themselves should be (almost) violation-free, otherwise
# adjust dt (1 / control_freq) or the tolerances.
constraints:
  qpos_key: qpos
  qvel_key: qvel
  action_key: actions
  dt: 0.05                 # ManiSkill default control_freq = 20 Hz
  n_revolute: 7
  # Panda URDF limits; fingers raised to 0.5 m/s (demos reach ~0.44)
  qvel_max: [2.175, 2.175, 2.175, 2.175, 2.61, 2.61, 2.61, 0.5, 0.5]
  action_low: -1.0         # pd_joint_delta_pos: normalized actions in [-1, 1]
  action_high: 1.0
  action_delta_scale: 0.1  # rad per unit action (pd_joint_delta_pos arm range)
  weights:
    kinematic: 1.0
    joint_limits: 1.0
    velocity_limits: 1.0
    acceleration_limits: 0.1
    action_bounds: 1.0
    action_consistency: 0.0  # PD tracking lag makes this approximate
