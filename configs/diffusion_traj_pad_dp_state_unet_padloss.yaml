# E6c: E5 (diffusion_traj_pad_dp_state_unet) with the loss also on the padded
# steps after the episode end (zero delta actions), as Diffusion Policy's padding.
name: "diffusion_trj_pad_dp_state_unet_padloss"
target: trainer.trainer_diffusion_traj.DiffusionTrajectoryPadHistTrainer
inpainting: False
start_indices: [0, 1, 2, 3, 4, 5 ,6 ,7, 8]

model:
  target: models.diffusion_unet1d.UNetTrjCC
  input_dim: 8         # actions only
  cond_dim: 7          # goal: box hole pose
  history: True
  history_shape: 35    # qpos 9 + qvel 9 + tcp_pose 7 + peg_pose 7 + peg_half_size 3
  history_len: 2       # = dataset.sequence_hist; the U-Net sees the flattened history
  unet_dims: [64, 128, 256]   # ManiSkill Diffusion Policy defaults
  diffusion_step_embed_dim: 64
  kernel_size: 5
  n_groups: 8
  num_inference_steps: 25
  guidance_scale: 1.5
  cfg_drop_prob: 0.1
  noise_scheduler:
    target: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 1000
    beta_start: 0.00001 #0.00001
    beta_end: 0.0085 # 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: False
    set_alpha_to_one: True
    steps_offset: 0
    prediction_type: epsilon # or sample or v_prediction
  guidance:
    target: models.utils.guidance_robot.CFGGuidance
    guidance_scale: 1.5
    constraint_eta: 0.0          # constraint guidance step (0 = off)
    constraint_grad_clip: 1.0
    constraint_start: 1.0        # fraction of the diffusion chain with guidance
    project_final: false

training:
  batch_size: 1024
  learning_rate: 0.0001
  num_epochs: 1001
  use_ema: True
  optimizer: "adamw"
  log_dir: "runs/training"
  log_eval_dir: "runs/inference"
  output_dir: "logs"
  val_every: 50           # ~5000 iterations, as the reference's eval_freq
  save_every: 50
  mixed_precision: "bf16"  # | "fp16" | "bf16"
  gradient_accumulation_steps: 1
  seed: 0
  num_workers: 8           # four runs in parallel
  mask_padding: false     # padded steps (robot at rest) are part of the loss
  checkpoint_path: "logs"
  device: "cuda:0"
  plotting: true
  tqdm_interval_sec: 1.0
  from_ckp: false
  ckpt_name: "20251118-175851/logs/checkpoint_395.pth"
  scheduler:
    name: cosine              # Options: linear, cosine, step, constant, etc.
    num_warmup_steps: 5000     # Optional, required for warmup-based schedulers

evaluation:
  action_horizon: 8        # actions executed per plan before replanning

ema:
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataset:
  target: dataset.dataset_maniskill.TrajectoryPadDatasetHDF5
  path: "mani_skill_data/demos/PegInsertionSide-v1/motionplanning/trajectory.state_dict+rgb.pd_joint_delta_pos.physx_cpu.h5"
  val: true
  split: true
  path_stats: "mani_skill_data/demos/PegInsertionSide-v1/motionplanning/stats_state.json"
  val_ratio: 0.2
  samples_per_episode: 128  # 797 episodes x 128 = 102k samples per epoch
  split_seed: 0           # fixed episode-level train/val split
  expand_goal: 0
  sequence_len: 16        # plan horizon: 0.8 s at 20 Hz (reference: pred_horizon 16)
  sequence_hist: 2        # history t-1, t0 (reference: obs_horizon 2)
  state_shapes:
    actions:
      shape: 8
      method_norm: "standard"

  goal_shapes:
    box_hole_pose:
      shape: 7
      method_norm: "minmax"
    # camera?

  obs_shapes:
    qpos:
      shape: 9
      method_norm: "minmax"  # Panda joints never wrap; sincos compresses narrow joints
    qvel:
      shape: 9
      method_norm: "standard"
    tcp_pose:
      shape: 7
      method_norm: "minmax"
    peg_pose:
      shape: 7
      method_norm: "minmax"
    peg_half_size:
      shape: 3
      method_norm: "minmax"
