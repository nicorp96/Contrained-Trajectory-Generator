# @package _global_
# E9 with plans resampled uniformly in joint-space path length (pauses get few points,
# fast motion many); non-uniform time stamps enter the constraints.
# Training and validation only: resampled actions cannot be executed step by step.
defaults:
  - override /physics: panda
name: e9_resampled_arclength
data:
  dataset:
    _target_: ctg.data.maniskill.ResampledDemoDataset
    resampler:
      _target_: ctg.data.resampling.ArcLengthResampler
      num_points: ${data.dataset.plan_len}
      path_field: qpos
      method: linear
    plan:
      qpos: {size: 9, norm: none}
      qvel: {size: 9, norm: none}
