[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctg"
version = "0.2.0"
description = "Constrained trajectory generation with diffusion models for robot manipulation"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.setuptools.packages.find]
include = ["ctg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
